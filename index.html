<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tolga Demiryol</title>
<meta name="description" content="Tolga Demiryol, Professor of Political Science. International political economy, geoeconomics, defence industrialization and middle powers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5f5d58;--rule:#e3e0d8;--accent:#7a2e1d;--card:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--muted:#a3a099;--rule:#2d2c29;--accent:#e0937c;--card:#1c1b19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 "Source Serif 4",Georgia,serif}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:2}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{font:600 17px Inter,sans-serif;color:var(--fg);text-decoration:none;letter-spacing:.01em}
nav a{font:500 14px Inter,sans-serif;color:var(--muted);text-decoration:none;margin-left:18px}
nav a:hover{color:var(--accent)}
.hero{padding:72px 0 40px}
.hero h1{font-size:46px;line-height:1.1;margin:0 0 10px;font-weight:600}
.hero .role{font:500 16px/1.5 Inter,sans-serif;color:var(--muted);margin:0 0 24px}
.hero p.lede{font-size:21px;max-width:680px;margin:0}
section{padding:40px 0;border-top:1px solid var(--rule)}
h2{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 22px}
h3{font-size:19px;margin:28px 0 10px;font-weight:600}
ul.pubs{list-style:none;padding:0;margin:0}
ul.pubs li{padding:10px 0;border-bottom:1px dotted var(--rule)}
ul.pubs li:last-child{border-bottom:0}
.venue{font-style:italic}
.yr{font:500 13px Inter,sans-serif;color:var(--muted);margin-right:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;font-size:16px}
.card b{display:block;font:600 14px Inter,sans-serif;margin-bottom:4px}
dl{margin:0;display:grid;grid-template-columns:120px 1fr;gap:8px 18px;font-size:17px}
dt{font:500 14px Inter,sans-serif;color:var(--muted);padding-top:3px}
dd{margin:0}
footer{padding:36px 0 56px;border-top:1px solid var(--rule);font:14px Inter,sans-serif;color:var(--muted)}
@media (max-width:600px){.hero h1{font-size:36px}nav a{margin:0 14px 0 0}dl{grid-template-columns:1fr}dt{padding-top:10px}}
</style>
</head>
<body>

<main class="wrap">
<div class="hero">
  <h1>Tolga Demiryol</h1>
  <p class="role">Professor of Political Science · Dean, Faculty of Economics, Administrative and Social Sciences, Altınbaş University, Istanbul</p>
</div>

<section id="contact">
  <h2>Contact</h2>
  <p><a href="mailto:tolga@tolgademiryol.com">tolga@tolgademiryol.com</a> · <a href="https://orcid.org/0000-0002-0410-3563">ORCID</a></p>
  <p style="color:var(--muted);font-size:16px">Full site coming soon.</p>
</section>
</main>

<footer><div class="wrap">© 2026 Tolga Demiryol</div></footer>
</body>
</html>
